name: core-tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q articheck scripts
      - run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - run: python -m articheck demo --sandbox local --output runs/ci-demo
      - name: Test the Docker execution path
        if: matrix.python == '3.11'
        run: |
          docker pull python:3.11-slim
          python -m articheck demo --sandbox docker --output runs/docker-demo
