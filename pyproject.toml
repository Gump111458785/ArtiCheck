[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "articheck"
version = "0.1.0"
description = "Evidence-grounded artifact pre-review and planner training scaffold"
requires-python = ">=3.10"
dependencies = ["pypdf==6.10.0"]

[project.optional-dependencies]
reproduction = []
cloud = ["Flask==3.1.2"]
train = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "datasets>=3", "pyarrow>=17"]

[project.scripts]
articheck = "articheck.cli:main"
articheck-workbench = "articheck.workbench:main"
articheck-review-api = "articheck.review_api:main"
articheck-review-submit = "articheck.review_client:main"

[tool.setuptools.packages.find]
include = ["articheck*"]
