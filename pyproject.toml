[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "articheck"
version = "0.1.0"
description = "Evidence-grounded artifact pre-review and planner training scaffold"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "datasets>=3", "pyarrow>=17"]

[project.scripts]
articheck = "articheck.cli:main"
articheck-workbench = "articheck.workbench:main"

[tool.setuptools.packages.find]
include = ["articheck*"]
