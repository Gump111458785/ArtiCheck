<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ArtiCheck</title><link rel="icon" href="./mark.svg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./login.css"></head>
<body class="login-page"><main class="login-layout"><section class="login-introduction"><a class="login-brand" href="./login.html"><img src="./mark.svg" alt="">ArtiCheck</a><div><h1>让论文主张<br>有据可查。</h1><p>从论文与代码，到实验执行、指标核对和审查报告。每一步保留依据，每一项结论都能追溯。</p><ol><li><strong>提交研究材料</strong><span>论文 PDF、代码 ZIP 或公开仓库</span></li><li><strong>协作审阅与执行</strong><span>自动准备计划，追踪实际运行</span></li><li><strong>回到证据与结果</strong><span>集中查看问题、指标与验收边界</span></li></ol></div><small>ArtiCheck 研究工作空间</small></section><section class="login-panel"><form id="login-form"><h2>登录工作空间</h2><p>仅限受邀用户。请使用管理员分发的账户。</p><label for="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32"><label for="password">密码</label><div class="login-password"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><span id="password-control"></span></div><div id="login-error" role="alert"></div><button class="btn primary" type="submit">登录</button><small>需要账户或重置密码？请联系向你发出邀请的管理员。</small></form></section></main><script type="module" src="./login.mjs"></script></body></html>
